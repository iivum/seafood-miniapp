server:
  port: 8080

spring:
  application:
    name: seafood-backend
  main:
    banner-mode: off
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/seafood}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32bytes}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 7
  admin:
    bootstrap-username: ${ADMIN_USERNAME:admin}
    bootstrap-password: ${ADMIN_PASSWORD:admin123}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.security: INFO
    com.seafood: DEBUG
