spring:
  application:
    name: seafood-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/seafood}
      auto-index-creation: false  # 索引由 MongoIndexInitializer 启动时显式创建
  threads:
    virtual:
      enabled: true  # Java 25 虚拟线程(参见 design.md §Java 25 现代化)

server:
  port: ${PORT:8080}
  # PR review push-sweep #3:显式 {@code none} —— 我们<em>不</em>信任 XFF(参见
  # {@code AdminRateLimitFilter.clientIp} 与 {@code AuthService.wechatLogin} 的注释)。
  # 原 {@code framework} 策略会注册 {@code ForwardedHeaderFilter} 处理 XFF for
  # Spring web(redirect URL / host / proto),但<em>不</em>动 {@code getRemoteAddr()},
  # 与我们"用 TCP 端 IP,绝不读 XFF"的立场是 gate/action mismatch ——
  # 配置文件给的是"会处理 XFF"的能力,代码却反过来完全忽略它,会让维护者误以为
  # 后续 PR 可以依赖 framework 的语义加 XFF 支持。{@code none} 让两边一致。
  forward-headers-strategy: none
  compression:
    enabled: true
  shutdown: graceful

# JWT 鉴权(参见 design.md §4)
security:
  jwt:
    secret: ${JWT_SECRET:}                # 启动时校验,缺失即 fail-fast
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    admin-secret: ${JWT_ADMIN_SECRET:}    # admin-ui 独立密钥
  # Sprint 2 §2.1 — HTTP 安全响应头基线,值可按 env 收紧
  headers:
    strict-transport-security: "max-age=31536000; includeSubDomains"
    x-content-type-options: "nosniff"
    x-frame-options: "DENY"
    referrer-policy: "strict-origin-when-cross-origin"
    permissions-policy: "geolocation=(), microphone=(), camera=()"
    content-security-policy: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'"
  # Sprint 2 §2.4 — /api/admin/** 限流(60 rpm per (IP, account))
  rate-limit:
    requests-per-minute: 60
    bucket-ttl-seconds: 120
  # Sprint 2 §3.8 — 登录失败锁定(5 次失败 / 15 分钟窗口 / 锁 15 分钟,user+admin 共用)
  login-lock:
    max-failures: 5
    window-minutes: 15
    lock-minutes: 15

# 业务端点
api:
  base-path: /api
  admin:
    base-path: /api/admin
    # PR review #8 + push review #1(FAIL-OPEN STATE DRIFT):admin 启动期密码
    # <em>必须</em>由 env 注入,缺即 fail-fast。YAML <em>不给</em>空串默认 ——
    # `${ADMIN_BOOTSTRAP_PASSWORD:}` 看似无害,实则 Spring 成功解析为空串,
    # 配合 {@code @Value} 无 default 会注入空串而非抛错,导致应用带空密码进入生产。
    # 现:无默认,env 缺失时 Spring 在 binding 阶段直接抛
    # {@code UnresolvedPlaceholderException} / {@code ConfigurationPropertiesBindException}
    # 阻断 ready。Bootstrap 校验仍由 {@code AuthService.adminLogin} 兜底(空密码 → IllegalStateException)。
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD}

management:
  # OpenSpec setup-observability-stack PR #2 / design §D2:management server 跑
  # 在独立端口 9090,与业务端口 8080 物理隔离;address 显式 0.0.0.0(容器内绑定
  # 任意接口,配合 docker-compose / k8s sidecar scrape)。业务端口 8080 **不**
  # 暴露 /actuator/**(由 `management.server.port` != `server.port` 触发,
  # Spring Boot 4 自动把 management endpoints 全部迁移到独立 context)。
  server:
    port: 9090
    address: 0.0.0.0
  endpoints:
    web:
      # OpenSpec setup-observability-stack PR #2:新增 `prometheus` 端点暴露
      # (Micrometer PrometheusMeterRegistry 自动注册);`health` / `info` 保留
      # 已有行为。
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      # access 控制端点的读/写权限,默认 read_only — 显式声明防止被无意改成
      # read_write(只有写权限才能修改 metrics 状态,read_only 是 scrape 唯一
      # 需要的权限)。
      access: read_only
  # OpenSpec setup-observability-stack PR #2 / design §D5:`application` 作
  # common tag 注入到所有 metrics(design §D5 决议,PR #2 阶段只配 common
  # tag,具体业务 counters 是 PR #3 工作)。该 tag 在 Prometheus 侧用于多服务
  # 联邦/聚合(`sum by (application) (rate(...))`)。
  metrics:
    tags:
      application: seafood-backend
  # PR #3 收口(CI native.yml smoke fail #2):
  # 1) probes.enabled=true 显式开 Kubernetes 风格 liveness/readiness 探针
  #    (Spring Boot 4 默认需 KUBERNETES_SERVICE_HOST env 才自动开,
  #    docker-compose 没设 → 必须 explicit)。启用后 Spring 自动注册
  #    LivenessStateHealthIndicator / ReadinessStateHealthIndicator,暴露
  #    /actuator/health/{liveness,readiness} 在 management port 9090。
  # 2) probes.add-additional-paths=true 同时在 main port 8080 上
  #    暴露 /livez 和 /readyz(spring docs 推荐 — management context 与
  #    main context 独立时,探针要反映 main app 状态而不是 management 状态)。
  #    smoke 脚本从 host 探 8080/livez 而非 8080/actuator/health/liveness
  #    (后者仅在 management port 9090 暴露,host 不可达,Security 兜底
  #    denyAll → 403)。
  health:
    probes:
      enabled: true
      add-additional-paths: true

logging:
  level:
    root: INFO
    com.seafood: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: INFO
  # dev 段在下方 spring.config.activate.on-profile: dev 段内覆写 pattern.console
# OpenSpec setup-observability-stack PR #1 / design §D1 + ADR-OQ2 — 结构化日志。
# dev profile 保留 console pattern(可读 + 显式 requestId MDC 字段);
# prod profile 切换为 Spring Boot 4 内置 structured logging(`logstash` schema,
# GraalVM Native 友好,无需手写 reflect-config)。{@code LOG_FORMAT=json} 环境变量
# 由 Spring Boot 3.4+ 原生支持 — 任意 profile 下都覆盖为 JSON 输出(便于本地复现
# 生产日志形态,见 spec §LOG_FORMAT env overrides dev format)。
---
spring:
  config:
    activate:
      on-profile: dev
logging:
  # dev profile:人类可读 pattern,显式打印 MDC requestId 字段(spec §Console
  # pattern in development profile)。structured.format.console 不设 → 走 pattern。
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId}] %logger{36} - %msg%n"
---
spring:
  config:
    activate:
      on-profile: prod
logging:
  # prod profile:Spring Boot 4 内置 structured logging(Logstash schema)。
  # 字段:`@timestamp` / `@version` / `message` / `logger_name` / `thread_name` /
  # `level` / `level_value`,MDC 字段(含 requestId)作为顶层 JSON key。
  # 写入与 console 同 — Loki / ES / SLS 都能直接消费(ADR-OQ2)。
  structured:
    format:
      console: logstash
      file: logstash
