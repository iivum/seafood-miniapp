spring:
  application:
    name: seafood-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/seafood}
      auto-index-creation: false  # 索引由 MongoIndexInitializer 启动时显式创建
  threads:
    virtual:
      enabled: true  # Java 25 虚拟线程(参见 design.md §Java 25 现代化)

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
  shutdown: graceful

# JWT 鉴权(参见 design.md §4)
security:
  jwt:
    secret: ${JWT_SECRET:}                # 启动时校验,缺失即 fail-fast
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    admin-secret: ${JWT_ADMIN_SECRET:}    # admin-ui 独立密钥
  # Sprint 2 §2.1 — HTTP 安全响应头基线,值可按 env 收紧
  headers:
    strict-transport-security: "max-age=31536000; includeSubDomains"
    x-content-type-options: "nosniff"
    x-frame-options: "DENY"
    referrer-policy: "strict-origin-when-cross-origin"
    permissions-policy: "geolocation=(), microphone=(), camera=()"
    content-security-policy: "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'"
  # Sprint 2 §2.4 — /api/admin/** 限流(60 rpm per (IP, account))
  rate-limit:
    requests-per-minute: 60
    bucket-ttl-seconds: 120
  # Sprint 2 §3.8 — 登录失败锁定(5 次失败 / 15 分钟窗口 / 锁 15 分钟,user+admin 共用)
  login-lock:
    max-failures: 5
    window-minutes: 15
    lock-minutes: 15

# 业务端点
api:
  base-path: /api
  admin:
    base-path: /api/admin
    # PR review #8:admin 启动期密码<em>必须</em>由 env 注入,缺即 fail-fast;
    # 这里给 dev profile 一个本地默认方便调试,生产用 env 覆盖。username 仍可走默认。
    # PR review #8 / CLAUDE.md "禁硬编码密钥"。BootstrapCredential 校验见
    # {@code AdminBootstrapProperties.isPasswordPresent()}。
    bootstrap:
      username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.seafood: DEBUG
    org.springframework.data.mongodb.core.MongoTemplate: INFO
