# ===========================================
# 海鲜商城 v2.0 — Docker Compose 单机部署
# 2 服务:backend (GraalVM Native binary) + mongodb
# 7 模块微服务已收敛为单仓(参见 refactor-rust-rebuild-frontend)
# ===========================================

networks:
  seafood-network:
    driver: bridge

volumes:
  mongodb_data:

services:
  # ===========================================
  # MongoDB — 唯一外部依赖
  # ===========================================
  mongodb:
    image: mongo:7
    container_name: seafood-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - seafood-network
    healthcheck:
      # Sprint 2 C5 §5.6:用 mongosh ping 校验;旧 `db.adminCommand('ping')` 形式
      # 在某些 mongosh 版本下解析失败,改用 file-based 命令更稳。
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ===========================================
  # Backend — GraalVM Native binary
  # 同时托管 admin-ui 静态资源(/admin/**) + 业务 API
  # 设计验收(参见 refactor-rust-rebuild-frontend/proposal.md §"GraalVM Native Image 启用"):
  #   - 启动 < 2s
  #   - 内存峰值 < 200MB
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sprint 2 C5 §5.6:image 标签改为 `seafood-backend:native`,与 CI build
    # (`.github/workflows/native.yml`)产出的本地 tag 对齐,便于 `docker save` /
    # `docker load` 在多机部署中复用。
    image: seafood-backend:native
    container_name: seafood-backend
    ports:
      - "8080:8080"
    networks:
      - seafood-network
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # Sprint 2 C5 §5.6:distroless 镜像无 wget/curl,所以不能用 `wget --spider`;
      # 改用 native binary 自带 --health-check 子命令(若不存在)或
      # /dev/tcp probe;此版本以 /actuator/health 200 为目标。
      test: ["CMD-SHELL", "cat </dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # 留足 native binary 冷启动 + MongoDB replica set 初始化
    restart: unless-stopped
    environment:
      # JWT 必填(参见 design §4.1)— fail-fast
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, 32+ bytes}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?JWT_ADMIN_SECRET must be set, 32+ bytes, must differ from JWT_SECRET}
      MONGODB_URI: mongodb://mongodb:27017/seafood
      SPRING_PROFILES_ACTIVE: docker
    deploy:
      resources:
        limits:
          memory: 256M       # 上限留 buffer;典型 < 200MB
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
