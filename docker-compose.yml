# ===========================================
# 海鲜商城 v2.0 — Docker Compose 单机部署
# 2 服务:backend (GraalVM Native binary) + mongodb
# 7 模块微服务已收敛为单仓(参见 refactor-rust-rebuild-frontend)
# ===========================================

networks:
  seafood-network:
    driver: bridge

volumes:
  mongodb_data:
  # v2 视觉 5.14 — 上传文件持久化(named volume)。容器重启 / 重建后图片
  # 仍在;若改用 host bind mount(./var/seafood/uploads:/app/var/seafood/uploads)
  # 也可,但 named volume 跨多机部署更一致(docker swarm / k8s 兼容)。
  seafood_uploads:

services:
  # ===========================================
  # MongoDB — 唯一外部依赖
  # ===========================================
  mongodb:
    image: mongo:7
    container_name: seafood-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - seafood-network
    healthcheck:
      # Sprint 2 C5 §5.6:用 mongosh ping 校验;旧 `db.adminCommand('ping')` 形式
      # 在某些 mongosh 版本下解析失败,改用 file-based 命令更稳。
      test: ["CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh localhost:27017/test --quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # ===========================================
  # Backend — GraalVM Native binary
  # 同时托管 admin-ui 静态资源(/admin/**) + 业务 API
  # 设计验收(参见 refactor-rust-rebuild-frontend/proposal.md §"GraalVM Native Image 启用"):
  #   - 启动 < 2s
  #   - 内存峰值 < 200MB
  # ===========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sprint 2 C5 §5.6:image 标签改为 `seafood-backend:native`,与 CI build
    # (`.github/workflows/native.yml`)产出的本地 tag 对齐,便于 `docker save` /
    # `docker load` 在多机部署中复用。
    image: seafood-backend:native
    container_name: seafood-backend
    ports:
      - "8080:8080"
    networks:
      - seafood-network
    # 5.14 上传持久化 — 挂 named volume 到 /app/var/seafood/uploads,
    # 与 application.yml 的 SEAFOOD_UPLOAD_DIR 默认值一致。
    volumes:
      - seafood_uploads:/app/var/seafood/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      # PR review C1:distroless (`gcr.io/distroless/base-debian12:nonroot`)
      # 无 shell、无 curl/wget/nc,任何依赖外部命令的 probe 都会因 ENOENT 失败。
      # 原 `CMD-SHELL + cat </dev/tcp/...` 永远 unhealthy。`native binary` 本身
      # 没有 `--health-check` 子命令,且加一个会膨胀 binary 与 GraalVM 反射面。
      # 决策:删 docker healthcheck,把"健康"判定交给容器外探针。
      # 部署侧应配 k8s readinessProbe:
      #   httpGet: { path: /actuator/health, port: 9090 }   # PR #2:管理端口 9090
      #                ^^^^^^^^^^^^^^^^^^^^^ 注意端口是 9090,不是业务 8080
      # 这样 readiness 由 Spring Actuator 自身决定(包括 MongoIndexHealthIndicator
      # 等 critical 依赖),行为比端口 probe 更准确。
      #
      # OpenSpec setup-observability-stack PR #2:management 端口独立后,
      # 容器内业务端口 8080 仍跑 API(对外服务),管理端口 9090 暴露 actuator
      # 给 k8s sidecar / Prometheus scrape。两者都 < 200MB RSS 预算,内存
      # limit 256M 仍够(2 个 Tomcat + actuator 共享 native binary heap)。
      #
      # 注意:`depends_on: mongodb: { condition: service_healthy }` 仍然有效
      # —— mongodb 是普通镜像,自带 mongosh,healthcheck 正常跑。
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s   # 留足 native binary 冷启动 + MongoDB replica set 初始化
    restart: unless-stopped
    environment:
      # JWT 必填(参见 design §4.1)— fail-fast
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set, 32+ bytes}
      JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET:?JWT_ADMIN_SECRET must be set, 32+ bytes, must differ from JWT_SECRET}
      # CI 修复 v2 (2026-06-07):MONGODB_URI 改为 ${MONGODB_URI:-...} 形式,
      # 让 CI smoke step 通过 env 注入短 serverSelectionTimeoutMS(默认 30s
      # 跟 smoke 总预算不兼容)。生产部署仍可显式 export MONGODB_URI 用长 timeout。
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongodb:27017/seafood}
      # 5.14-5.17:Spring Boot 4 (2026-06-14) prefix 改 `spring.mongodb`(旧
      # `spring.data.mongodb` deprecated,被静默忽略 → 默认 localhost:27017)。
      # env var 同步改 `SPRING_MONGODB_URI`。`MONGODB_URI` 由 relaxed binding
      # 自动映射到 `spring.mongodb.uri`。
      SPRING_MONGODB_URI: ${SPRING_MONGODB_URI:-mongodb://mongodb:27017/seafood}
      # PR review #8:admin bootstrap 密码必填,缺即 fail-fast(@Value 无默认 + adminLogin 启动期校验)
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?ADMIN_BOOTSTRAP_PASSWORD must be set, no default}
      # 5.14 — 容器内上传根目录(/app/var/seafood/uploads 与 volume 挂载点对齐)
      SEAFOOD_UPLOAD_DIR: /app/var/seafood/uploads
      SPRING_PROFILES_ACTIVE: docker
    deploy:
      resources:
        limits:
          memory: 256M       # 上限留 buffer;典型 < 200MB
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
