# =====================================================
# Security workflow (Sprint 2 §4.3)
#   - OWASP Dep-Check (SCA):  ./gradlew dependencyCheckAnalyze
#   - TruffleHog (secret scan): git file:///repo --since-commit=HEAD~1
# 两个 job 并行;SARIF 全部上传到 GitHub Code Scanning。
# =====================================================
name: Security

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]

# PR review C3:显式声明 GITHUB_TOKEN 权限。默认 token 不含 security-events: write,
# 静默导致 github/codeql-action/upload-sarif@v3 报 403,SARIF 永远到不了 Code Scanning。
permissions:
  contents: read
  security-events: write

# 所有 run: 块均硬编码,无 ${{ github.event.* }} 插值
jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # CI 修复:超时从 15 提到 30 分钟 —— NVD 数据下载 + 全 transitive dep 扫描常超过
    # 15min(尤其首次冷启动)。30min 是 NVD 推荐 + 实测稳定值。
    timeout-minutes: 30
    env:
      CI: "true"   # 触发 build.gradle 中 CI-only 的 dependsOn binding
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache OWASP NVD datafeed
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ hashFiles('backend/build.gradle', 'backend/dependency-check-suppressions.xml') }}
          restore-keys: owasp-nvd-

      - name: Run Dependency-Check Analyze
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # CI 修复:用 daemon(默认)替代 --no-daemon —— plugin 解析失败时,daemon
        # 可复用 pluginManagement 缓存 + 减少冷启动网络尖刺。NVD cache 已在前面步骤
        # 暖好,dependencyCheckAnalyze 实际跑 scan 阶段只需 ~5-10min。
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/build/reports/dependency-check-report.sarif
          category: dependency-check

  secret-scan:
    name: TruffleHog (PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 拿 HEAD~1 给 --since-commit 用

      - name: TruffleHog git diff scan
        # PR review v8(C4 + C5 + I8):从 filesystem + tmpfs hack (a80518b / 7fdb7b3 /
        # 043a693) 切到 `git` 模式。理由:
        # 1) `git` 模式原生支持 --since-commit=HEAD~1(a80518b 之前的设计意图),
        #    配合上面 fetch-depth: 2,HEAD~1 在 runner checkout 里一定存在。
        # 2) tmpfs 覆盖 .git 的方案(7fdb7b3 / 043a693)在 runner 上从未被日志验证,
        #    且为屏蔽 .git/config(CI 临时写 ghs_... extraheader)而隐藏整个 .git,
        #    范围过宽。
        # 3) `git` 模式扫的是 commit 历史而非 working tree,正好需要 .git 存在 ——
        #    所以 tmpfs hack 反而跟需求方向相反。
        # 4) 去掉 --exclude-detectors MongoDB,Postgres(C5):mongodb://user:pass@host/db
        #    是项目最常见的 secret 形态;该排除项是 alice:hunter2 FP 时代遗留,
        #    2e8e5b6 改名为 TEST_USER_FAKE:TEST_PASSWORD_FAKE 后已无 FP 风险。
        # 5) 镜像 pin 3.88.0(I8):f475004 曾经 pin 过,043a693 切到 :latest 时丢了。
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            trufflesecurity/trufflehog:3.88.0 \
            git file:///repo --fail --no-verification \
            --since-commit=HEAD~1
