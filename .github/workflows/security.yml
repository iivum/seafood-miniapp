# =====================================================
# Security workflow (Sprint 2 §4.3)
#   - OWASP Dep-Check (SCA):  ./gradlew dependencyCheckAnalyze
#   - TruffleHog (secret scan): git file:///repo --since-commit=HEAD~1
# 两个 job 并行;SARIF 全部上传到 GitHub Code Scanning。
# =====================================================
name: Security

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]

# Sprint 2 CI 加速 (2026-06-07):新 push 立刻取消同 PR 的旧 run,避免占 runner。
# main / feat/* / fix/* 上不取消(group key 含 ref,各分支独立)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# PR review C3:显式声明 GITHUB_TOKEN 权限。默认 token 不含 security-events: write,
# 静默导致 github/codeql-action/upload-sarif@v3 报 403,SARIF 永远到不了 Code Scanning。
permissions:
  contents: read
  security-events: write

# 所有 run: 块均硬编码,无 ${{ github.event.* }} 插值
jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    # CI 修复:超时从 15 提到 30 分钟 —— NVD 数据下载 + 全 transitive dep 扫描常超过
    # 15min(尤其首次冷启动)。30min 是 NVD 推荐 + 实测稳定值。
    timeout-minutes: 30
    env:
      CI: "true"   # 触发 build.gradle 中 CI-only 的 dependsOn binding
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Compute ISO week for cache key
        id: iso-week
        run: echo "week=$(date -u +'%G-%V')" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP NVD datafeed
        # Sprint 2 CI 加速 (2026-06-07):cache key 改为 weekly bucket,
        # 不再 hash build.gradle —— 改 backend/build.gradle(加 dep / 改 plugin
        # 版本)不应让 NVD datafeed cache 失效(NVD 数据库内容跟 build.gradle 完全
        # 解耦)。weekly bucket 保证最多 7 天拿一次全量 + 每次跑只下增量。
        # restore-keys 兜底:本周 miss 时复用上周 cache 也比从 0 拉强。
        # GITHUB_RUN_ID 加在 key 末尾确保<em>每次</em>都 save(同 week 内多次跑能滚动
        # 更新缓存),restore 时按周匹配。
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-week-${{ steps.iso-week.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-week-${{ steps.iso-week.outputs.week }}-
            owasp-nvd-${{ runner.os }}-week-
            owasp-nvd-${{ runner.os }}-

      - name: Run Dependency-Check Analyze
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # CI 修复:用 daemon(默认)替代 --no-daemon —— plugin 解析失败时,daemon
        # 可复用 pluginManagement 缓存 + 减少冷启动网络尖刺。NVD cache 已在前面步骤
        # 暖好,dependencyCheckAnalyze 实际跑 scan 阶段只需 ~5-10min。
        run: ./gradlew dependencyCheckAnalyze

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/build/reports/dependency-check-report.sarif
          category: dependency-check

  secret-scan:
    name: TruffleHog (PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 拿 HEAD~1 给 --since-commit 用

      - name: TruffleHog git diff scan
        # PR review v9(2026-06-07):重新加回测试目录 exclude,但用 --exclude-globs
        # 而不是 --exclude-detectors。原因:v8 注释假设"改名 TEST_USER_FAKE 后无 FP"
        # 是错的 —— TruffleHog 的 MongoDB/Postgres detector <em>不验证 username</em>,
        # 只识别 URL scheme (`mongodb://...@host/db`),所以测试 fixture 仍然命中
        # 7 个 unverified secret,触发 exit 183。
        #
        # 当前策略:
        # 1) `git` 模式 + --since-commit=HEAD~1 不变(v8 的设计意图)。
        # 2) --exclude-globs 排除测试目录和 workflow 自身的 docstring URL:
        #    - backend/src/test/**:所有 fixture 和 IT(MongoUriValidatorTest /
        #      ConfigPropsMaskingIT 等)用 db.example.com 占位符,detector 仍会命中。
        #    - .github/**:本 workflow 注释里举例的 URI 也被扫到。
        #    生产代码里的 mongodb://user:pass@... 仍然会被扫(detector 不被禁,
        #    只是路径范围收窄),这是 v8 想保留的检测能力。
        # 3) 镜像 pin 3.88.0 不变(I8)。
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            trufflesecurity/trufflehog:3.88.0 \
            git file:///repo --fail --no-verification \
            --since-commit=HEAD~1 \
            --exclude-globs='backend/src/test/**,.github/**'
