# =====================================================
# Security workflow (Sprint 2 §4.3)
#   - OWASP Dep-Check (SCA):  ./gradlew dependencyCheckAnalyze
#   - TruffleHog (secret scan): filesystem --since-commit=HEAD~1
# 两个 job 并行;SARIF 全部上传到 GitHub Code Scanning。
# =====================================================
name: Security

on:
  pull_request:
  push:
    branches: [main, "feat/**", "fix/**"]

# 所有 run: 块均硬编码,无 ${{ github.event.* }} 插值
jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"   # 触发 build.gradle 中 CI-only 的 dependsOn binding
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Cache OWASP NVD datafeed
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: owasp-nvd-${{ hashFiles('backend/build.gradle', 'backend/dependency-check-suppressions.xml') }}
          restore-keys: owasp-nvd-

      - name: Run Dependency-Check Analyze
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew --no-daemon dependencyCheckAnalyze

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: backend/build/reports/dependency-check-report.sarif
          category: dependency-check

  secret-scan:
    name: TruffleHog (PR diff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # 拿 HEAD~1 给 --since-commit 用

      - name: TruffleHog filesystem scan
        # CI 修复 v2:之前 3.84.4 也不存在 —— trufflehog/trufflehog 这个 repo
        # 不是 TruffleHog 官方。官方是 trufflesecurity/trufflehog,GitHub Action
        # 路径是 trufflesecurity/trufflehog-action(且版本号独立)。
        # 改用 Docker 镜像跑(最稳,不依赖 action 仓库版本):
        #   docker run trufflesecurity/trufflehog:latest filesystem ...
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -e GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" \
            trufflesecurity/trufflehog:latest \
            filesystem --directory=/repo --since-commit=HEAD~1 --fail --no-verification
