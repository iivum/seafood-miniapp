name: Nightly k6 Load Baseline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  k6-baseline:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Build backend (JVM mode for k6)
        working-directory: backend
        run: ./gradlew bootJar -x test -x processTestAot
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'nightly-ci-placeholder-secret-key-32bytes' }}
          JWT_ADMIN_SECRET: ${{ secrets.JWT_ADMIN_SECRET || 'nightly-ci-admin-secret-key-32bytes' }}

      - name: Start backend
        working-directory: backend
        run: |
          java -jar build/libs/*.jar &
          until curl -sf http://localhost:8080/api/products?page=0&size=1; do sleep 2; done
        env:
          MONGODB_URI: mongodb://localhost:27017/seafood
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'nightly-ci-placeholder-secret-key-32bytes' }}
          JWT_ADMIN_SECRET: ${{ secrets.JWT_ADMIN_SECRET || 'nightly-ci-admin-secret-key-32bytes' }}
          WECHAT_ENABLED: 'false'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6 -y

      - name: Run k6 baseline
        working-directory: backend
        run: bash scripts/k6-run.sh

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-${{ github.run_id }}
          path: |
            backend/scripts/k6-stats.json
            backend/scripts/k6-results.json
          retention-days: 30
