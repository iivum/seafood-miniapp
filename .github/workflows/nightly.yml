name: Nightly k6 Load Baseline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  k6-baseline:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Build backend (JVM mode for k6)
        working-directory: backend
        run: ./gradlew bootJar -x test -x processTestAot
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'nightly-ci-placeholder-secret-key-32bytes' }}
          JWT_ADMIN_SECRET: ${{ secrets.JWT_ADMIN_SECRET || 'nightly-ci-admin-secret-key-32bytes' }}

      - name: Start backend
        working-directory: backend
        run: |
          java -jar build/libs/*.jar &
          until curl -sf "http://localhost:8080/api/products?page=0&size=1"; do sleep 2; done
        env:
          MONGODB_URI: mongodb://localhost:27017/seafood
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'nightly-ci-placeholder-secret-key-32bytes' }}
          JWT_ADMIN_SECRET: ${{ secrets.JWT_ADMIN_SECRET || 'nightly-ci-admin-secret-key-32bytes' }}
          # PR review #8 同款漏配:admin.bootstrap.password 无默认值(AuthService.java:60),
          # ci.yml/native.yml 当时都补了这条,nightly.yml 漏了 —— 缺失时 ApplicationContext
          # 启动直接失败(UnsatisfiedDependencyException → authService 创建失败),backend
          # 进程崩溃退出,后续 k6-run.sh 探测到端口不通报 "backend not reachable"。
          ADMIN_BOOTSTRAP_PASSWORD: nightly-ci-admin-bootstrap-password-not-the-default
          WECHAT_ENABLED: 'false'

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install k6 -y

      - name: Run k6 baseline
        working-directory: backend
        run: bash scripts/k6-run.sh

      - name: Upload k6 results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-results-${{ github.run_id }}
          path: |
            backend/scripts/k6-stats.json
            backend/scripts/k6-results.json
          retention-days: 30

  # Sprint 4 C1 — PIT 变异测试(行覆盖率看不见的断言有效性闸)。
  # 只变异 order/product 核心包(domain 纯函数 + application 用 Mockito),不需 MongoDB。
  # 慢(~1min),不进 PR 主链;每晚跑一次,变异分 < 70% 即失败,报告留 30 天。
  pitest-mutation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'graalvm'

      - name: Run PIT mutation testing
        working-directory: backend
        run: ./gradlew pitest -PexcludeTags=docker
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET || 'nightly-ci-placeholder-secret-key-32bytes' }}
          JWT_ADMIN_SECRET: ${{ secrets.JWT_ADMIN_SECRET || 'nightly-ci-admin-secret-key-32bytes' }}

      - name: Upload PIT mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pitest-report-${{ github.run_id }}
          path: backend/build/reports/pitest/
          retention-days: 30
