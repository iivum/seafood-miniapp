name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Sprint 2 CI 加速 (2026-06-07):新 push 立刻取消同 PR 的旧 run。
# main/develop push 不取消(group key 含 ref)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 单 job 串行跑:快速反馈,共享缓存
# 安全:所有 run: 块均硬编码,无 ${{ github.event.* }} 插值
# Sprint 2 CI 修复 (2026-06-08):Node.js 20 actions 已弃用(2026-09-16 升 hard error)。
# 8 类 action 已升到 Node 24 兼容 major(checkout@v6 / setup-node@v6 /
# setup-java@v5 / cache@v5 / upload-artifact@v5 / docker/login-action@v4 /
# codeql-action/upload-sarif@v4)。
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 是 fail-safe:即使未来 PR 引入未升的新
# action,这个 env var 强制所有 JS action 走 Node 24 runtime(覆盖 action 自身
# 声明的 node20),防止 Node 20 deprecation 警告回流。
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  # v2-visual-redesign Sprint 0 (2026-06-13):design token 派生 + parity 护栏。
  # 跑在所有下游 job 之前,3 分钟超时;零 npm 依赖(Node 自带 --test)。
  # 任何改 docs/redesign/tokens.json 的 PR 都会触发本 job 验证 mp + admin 两端
  # 派生产物一一对应(visual-design-system spec § "Cross-surface token parity test")。
  tokens:
    name: Design Tokens (v2 OKLch parity)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Build tokens (mp WXSS + admin Tailwind TS)
        run: npm run build:tokens
      - name: Parity test (wxss ↔ tailwind.ts ↔ tokens.json)
        run: npm run test:tokens

  backend:
    name: Backend (Java 25 + GraalVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-test-secret-must-be-at-least-32-bytes-long-AAAA
      JWT_ADMIN_SECRET: ci-test-admin-secret-must-be-at-least-32-bytes-BBBB
      MONGODB_URI: mongodb://localhost:27017/seafood_test
      # PR review #8:admin bootstrap 密码 @Value 无默认,CI 必须显式注入
      ADMIN_BOOTSTRAP_PASSWORD: ci-test-admin-bootstrap-password-not-the-default
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Sprint 3 B: gradle/actions/setup-gradle@v3 替代 actions/cache@v5 —
      # remote build cache + 自动 gradle.properties 的 org.gradle.caching=true。
      # cache-read-only: PR 只读不写,防 cache 投毒;push to main 走 read+write。
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        # CI 修复 (2026-06-22):Post Setup Gradle 后处理步骤在 GitHub Actions 缓存
        # 服务瞬时 400 时失败(试图保存 Gradle 9.6.0 发行版缓存),导致所有测试通过后
        # 整个 Backend job 仍报 failure。continue-on-error 使 post-action 缓存故障
        # 不阻塞 job;真实 Gradle 安装失败会在 Compile 步骤暴露。
        continue-on-error: true
        with:
          cache-disabled: false
          cache-read-only: ${{ github.event_name != 'pull_request' }}
          gradle-home-cache-cleanup: true

      - name: Compile
        working-directory: backend
        run: ./gradlew --no-daemon --build-cache --parallel compileJava

      - name: Test + check (含 @RefreshScope 扫描 + Jacoco coverage gate)
        working-directory: backend
        run: ./gradlew --no-daemon --build-cache --parallel check

      # Sprint 3 B coverage-gate: 上传 Jacoco HTML/XML report 作为 CI artifact,
      # retention 7 days,供 PR review 查 per-file coverage(Sprint 4 D3 落 Codecov)。
      - name: Upload Jacoco coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: backend/build/reports/jacoco/test/**
          retention-days: 7

      # Sprint 4 D3: PR comment with per-file coverage diff (self-hosted,
      # no Codecov external service). Reads Jacoco XML and posts a single
      # comment per PR; survives force-pushes (uses comment_id marker).
      - name: PR coverage comment
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'backend/build/reports/jacoco/test/jacocoTestReport.xml';
            if (!fs.existsSync(path)) { console.log('No Jacoco XML, skipping'); return; }
            const xml = fs.readFileSync(path, 'utf8');
            // Parse <counter type="INSTRUCTION" ...> aggregate + <package> children
            const totalMissed = (xml.match(/<counter type="INSTRUCTION" missed="(\d+)" covered="(\d+)"\/>/g) || [])
              .reduce((acc, m) => {
                const [, missed, covered] = m.match(/missed="(\d+)" covered="(\d+)"/);
                return { missed: acc.missed + +missed, covered: acc.covered + +covered };
              }, { missed: 0, covered: 0 });
            const total = totalMissed.missed + totalMissed.covered;
            const pct = total === 0 ? 0 : (totalMissed.covered / total * 100).toFixed(1);
            const banner = +pct < 80
              ? `❌ Coverage ${pct}% (gate 80% failed)\n\n`
              : `✅ Coverage ${pct}%\n\n`;
            const body = banner + 'See `jacoco-coverage` artifact for per-file breakdown.';
            // Find existing comment (idempotent across force-pushes)
            const marker = '<!-- jacoco-coverage-comment -->';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: marker + '\n' + body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: marker + '\n' + body,
              });
            }

      - name: Native compile (best-effort,design §10 风险 #1)
        if: github.event_name != 'pull_request'
        working-directory: backend
        continue-on-error: true
        run: ./gradlew --no-daemon --build-cache --parallel nativeCompile

  # Sprint 4 C1 — PR-scoped 增量变异测试(roadmap test-roadmap spec "gates PR merge")。
  # 只对本 PR 改动的核心模块(order / product)跑 PIT,按各模块基线 floor 卡门(order 80 /
  # product 40,见 build.gradle pitMap)。不碰核心模块的 PR 直接跳过 → 不拖慢无关 PR。
  # 全量 70% gate 仍在 nightly.yml(慢,~1min/模块)。独立 job 与 backend 并行,不进其临界路径。
  # 安全:run 块用内置 env $GITHUB_BASE_REF,不做 ${{ github.event.* }} 插值。
  pitest-incremental:
    name: PIT Mutation (PR-scoped changed modules)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-test-secret-must-be-at-least-32-bytes-long-AAAA
      JWT_ADMIN_SECRET: ci-test-admin-secret-must-be-at-least-32-bytes-BBBB
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # 需历史以 diff PR base

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-disabled: false
          cache-read-only: true

      - name: Detect changed core modules & run scoped PIT
        working-directory: backend
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
          changed=$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD" -- \
            src/main/java/com/seafood/order src/main/java/com/seafood/product \
            src/test/java/com/seafood/order src/test/java/com/seafood/product || true)
          echo "Changed core files:"; echo "$changed"
          scopes=""
          echo "$changed" | grep -q "com/seafood/order/"   && scopes="order"
          echo "$changed" | grep -q "com/seafood/product/" && scopes="${scopes:+$scopes }product"
          if [ -z "$scopes" ]; then
            echo "本 PR 未改 order/product 核心代码 — 跳过增量变异 gate。"
            exit 0
          fi
          for s in $scopes; do
            echo "::group::PIT mutation — scope=$s"
            ./gradlew --no-daemon --build-cache pitest -PpitScope="$s" -PexcludeTags=docker
            echo "::endgroup::"
          done

      - name: Upload PIT report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-pr-report
          path: backend/build/reports/pitest/**
          retention-days: 7

  frontend:
    name: Mini-Program (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Test
        working-directory: frontend
        run: npm test -- --coverage
      - name: Build
        working-directory: frontend
        run: npm run build || true   # 微信小程序 CLI 在 CI 跳过

  admin-ui:
    name: Admin UI (Vitest + coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Test + Coverage Gate
        working-directory: admin-ui
        run: |
          npm ci || npm install
          npm run test:coverage

  # Sprint 2 CI 修复 (2026-06-07):删 docker job。
  # 原 job 跑 `docker build -t seafood-backend:ci-test .`,但 Dockerfile 自 P0 #2
  # 改成单阶段 COPY pre-built binary (P0 #2 commit 553f107),依赖 nativeCompile
  # 已产出 backend/build/native/nativeCompile/seafood-backend。CI workflow 这边
  # 没有 nativeCompile step (那是 native.yml 的职责),所以 docker build 必然报
  # "build/native/nativeCompile/seafood-backend: not found"(2074033 run 5m48:45
  # 失败 9s)。
  #
  # 原 job 标 `continue-on-error: true` 是历史 best-effort 兜底,但失败 status
  # 会污染 PR 整体 status 视觉。Native workflow (native.yml) 已独立跑 docker
  # build + Trivy + smoke (line 165-170),职责已上移;CI workflow 删 docker job
  # 是责任单一化的结果。
