name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Sprint 2 CI 加速 (2026-06-07):新 push 立刻取消同 PR 的旧 run。
# main/develop push 不取消(group key 含 ref)。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 单 job 串行跑:快速反馈,共享缓存
# 安全:所有 run: 块均硬编码,无 ${{ github.event.* }} 插值
jobs:
  backend:
    name: Backend (Java 25 + GraalVM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-test-secret-must-be-at-least-32-bytes-long-AAAA
      JWT_ADMIN_SECRET: ci-test-admin-secret-must-be-at-least-32-bytes-BBBB
      MONGODB_URI: mongodb://localhost:27017/seafood_test
      # PR review #8:admin bootstrap 密码 @Value 无默认,CI 必须显式注入
      ADMIN_BOOTSTRAP_PASSWORD: ci-test-admin-bootstrap-password-not-the-default
    services:
      mongodb:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: 'graalvm-community'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Compile
        working-directory: backend
        # Sprint 2 CI 加速 (2026-06-07):--build-cache 复用 actions/cache 持久化的 task output
        run: ./gradlew --no-daemon --build-cache --parallel compileJava

      - name: Test + check (含 @RefreshScope 扫描)
        working-directory: backend
        run: ./gradlew --no-daemon --build-cache --parallel check

      - name: Native compile (best-effort,design §10 风险 #1)
        working-directory: backend
        continue-on-error: true
        run: ./gradlew --no-daemon --build-cache --parallel nativeCompile

  frontend:
    name: Mini-Program (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci || npm install
      - name: Test
        working-directory: frontend
        run: npm test -- --coverage
      - name: Build
        working-directory: frontend
        run: npm run build || true   # 微信小程序 CLI 在 CI 跳过

  admin-ui:
    name: Admin UI (Vitest,可选)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true   # §9 还没落地
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test
        working-directory: admin-ui
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm test
          else
            echo "admin-ui/ not present yet (refactor §9 deferred)"
          fi

  docker:
    name: Docker build (best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: backend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        working-directory: backend
        run: docker build -t seafood-backend:ci-test .
